<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<title>$GODOT_PROJECT_NAME</title>
	<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}
body {
	color: white;
	background-color: #10231b;
	overflow: hidden;
	touch-action: none;
}
#canvas {
	display: block;
}
#canvas:focus {
	outline: none;
}
#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}
#status, #status-splash {
	top: 0;
	bottom: 0;
}
#status {
	background: radial-gradient(ellipse at 50% 35%, #365333, #10231b 72%);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}
#status-splash {
	display: none !important;
}
#status-splash.show-image--false {
	display: none;
}
#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}
#status-splash.use-filter--false {
	image-rendering: pixelated;
}
#status-progress, #status-notice {
	display: none;
}
#status-progress {
	bottom: 10%;
	width: min(72%, 420px);
	height: 8px;
	margin: 0 auto;
	overflow: hidden;
	background: #071a12;
	border: 1px solid #8eaa7640;
	box-shadow: inset 0 1px 4px #0008;
}
#status-progress-fill { display: block; width: var(--load-progress, 0%); height: 100%; border-radius: inherit; background: linear-gradient(90deg, #e9b83d, #ffdc70, #92d66d); transition: width .18s ease-out; }
#status-progress.compiling { background: #0d2b1d; }
#status-progress.compiling #status-progress-fill { width: 38%; box-shadow: 0 0 12px #ffdc7088; animation: compile-sweep 1.15s ease-in-out infinite; }
@keyframes compile-sweep { 0% { transform: translateX(-115%); } 100% { transform: translateX(330%); } }
#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: system-ui, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
#status-hint {
	display: none;
	margin-top: 1rem;
	padding: 0 1.5rem;
	max-width: 28rem;
	text-align: center;
	font: 500 0.95rem/1.4 system-ui, sans-serif;
	color: #e4ead6;
}
#vatar-banner {
	display: none;
	position: absolute;
	top: 0;
	left: 0;
	right: 0;
	z-index: 40;
	padding: 8px 12px;
	background: rgba(8, 28, 14, 0.92);
	color: #f6e27a;
	font: 600 13px/1.3 system-ui, sans-serif;
	text-align: center;
	pointer-events: none;
}
	</style>

	$GODOT_HEAD_INCLUDE
	<style>
#loading-brand { font: 900 clamp(28px, 5vw, 54px)/1.1 system-ui, sans-serif; letter-spacing: -.06em; color: #ffdc70; z-index: 1; margin: 0 20px 14px; text-shadow: 0 4px #17271a; }
#loading-brand span { color: #a7df83; }
#loading-copy { font: 600 12px/1.5 system-ui, sans-serif; letter-spacing: .2em; text-transform: uppercase; color: #b8cbaa; z-index: 1; }
#status-hint { position: relative; z-index: 1; margin-top: 30px; font-size: 13px; }
#status-progress { bottom: 22%; border: 0; border-radius: 6px; }
#status-retry { display: none; position: relative; z-index: 2; margin-top: 14px; border: 1px solid #ffdc7080; border-radius: 10px; color: #17271a; background: #ffdc70; padding: 9px 15px; font: 800 12px system-ui; cursor: pointer; }
#status-retry.visible { display: block; }
#fullscreen { position: fixed; bottom: max(12px, env(safe-area-inset-bottom)); right: max(12px, env(safe-area-inset-right)); z-index: 20; border: 1px solid #a1bc8960; border-radius: 12px; color: #e8efd8; background: #142a1ee6; padding: 10px 14px; font: 600 12px system-ui; cursor: pointer; }
#fullscreen[hidden] { display: none; }
#sound-unlock { position: fixed; bottom: max(12px, env(safe-area-inset-bottom)); left: max(12px, env(safe-area-inset-left)); z-index: 21; border: 1px solid #ffdc7080; border-radius: 12px; color: #17271a; background: #ffdc70; padding: 10px 14px; font: 800 12px system-ui; cursor: pointer; box-shadow: 0 4px 18px #0006; }
#sound-unlock[hidden] { display: none; }
#orientation-hint { display: none; position: fixed; bottom: 18%; left: 8%; right: 8%; text-align: center; font: 500 14px/1.6 system-ui; color: #d3ddc8; pointer-events: none; }
@media (orientation: portrait) and (max-width: 750px) { #orientation-hint { display: block; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
	</style>
	<script src="https://lagoslife.app/sdk/vatar-games-v1.js"></script>
</head>
<body>
	<div id="vatar-banner"></div>
	<canvas id="canvas" aria-label="Cluck and Worms arcade playfield. Aim and click to fire. Space swaps worms. Escape pauses." tabindex="0">
		Your browser does not support the canvas tag.
	</canvas>
	<noscript>Your browser does not support JavaScript.</noscript>
	<button id="fullscreen" type="button" aria-label="Enter fullscreen" hidden>Fullscreen</button>
	<button id="sound-unlock" type="button" aria-label="Enable game sound" hidden>Tap for sound</button>
	<div id="orientation-hint">Turn your phone sideways for a larger playfield.<br>Your game stays paused while you switch.</div>
	<div id="status">
		<h1 id="loading-brand">CLUCK <span>&amp; WORMS</span></h1>
		<div id="loading-copy">Small chicken. Big chain reactions.</div>
		<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
		<div id="status-progress" role="progressbar" aria-label="Loading game" aria-valuemin="0" aria-valuemax="100"><span id="status-progress-fill"></span></div>
		<div id="status-hint">Downloading…</div>
		<button id="status-retry" type="button">Reload game</button>
		<div id="status-notice"></div>
	</div>

	<script src="$GODOT_URL"></script>
	<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;

/** Track and resume the Web Audio context that Godot creates during startup. */
const soundUnlockButton = document.getElementById("sound-unlock");
window.CluckAudio = (() => {
	const contexts = new Set();
	const callbacks = [];
	let unlocked = false;
	let engineReady = false;
	let musicSource = null;
	let musicBuffer = null;
	let musicRequest = null;
	let masterLevel = 1;
	let musicLevel = 0.7;
	let sfxLevel = 1;
	let muted = false;
	const NativeAudioContext = window.AudioContext || window.webkitAudioContext;
	let webContext = null;
	let musicGain = null;
	let sfxGain = null;

	function notifyIfRunning() {
		if (![...contexts].some((context) => context.state === "running")) return false;
		if (!unlocked) {
			unlocked = true;
			callbacks.splice(0).forEach((fn) => { try { fn(); } catch (_) {} });
		}
		soundUnlockButton.hidden = true;
		return true;
	}

	async function unlock() {
		await Promise.allSettled([...contexts].map((context) => context.state === "running" ? null : context.resume()));
		return notifyIfRunning();
	}

	function register(context) {
		contexts.add(context);
		context.addEventListener("statechange", notifyIfRunning);
		if (engineReady && !notifyIfRunning()) soundUnlockButton.hidden = false;
		return context;
	}

	if (NativeAudioContext) {
		const WrappedAudioContext = new Proxy(NativeAudioContext, {
			construct(target, args) { return register(Reflect.construct(target, args, target)); },
		});
		try { window.AudioContext = WrappedAudioContext; } catch (_) {}
		try { if (window.webkitAudioContext) window.webkitAudioContext = WrappedAudioContext; } catch (_) {}
		webContext = new WrappedAudioContext({ latencyHint: "interactive" });
		musicGain = webContext.createGain();
		sfxGain = webContext.createGain();
		musicGain.connect(webContext.destination);
		sfxGain.connect(webContext.destination);
	}

	function updateMix() {
		if (!webContext) return;
		const now = webContext.currentTime;
		const master = muted ? 0 : masterLevel;
		musicGain.gain.setTargetAtTime(master * musicLevel * 0.72, now, 0.025);
		sfxGain.gain.setTargetAtTime(master * sfxLevel * 0.82, now, 0.015);
	}

	async function loadMusic() {
		if (musicBuffer) return musicBuffer;
		if (!musicRequest) musicRequest = fetch("menu_farmyard_loop.ogg", { cache: "force-cache" })
			.then((response) => { if (!response.ok) throw new Error("music_" + response.status); return response.arrayBuffer(); })
			.then((data) => webContext.decodeAudioData(data))
			.then((buffer) => (musicBuffer = buffer))
			.catch((error) => { console.error("Web music failed:", error); return null; });
		return musicRequest;
	}

	async function playMusic() {
		if (!webContext) return;
		const buffer = await loadMusic();
		if (!buffer || musicSource) return;
		musicSource = webContext.createBufferSource();
		musicSource.buffer = buffer;
		musicSource.loop = true;
		musicSource.connect(musicGain);
		musicSource.start();
	}

	function stopMusic() {
		if (!musicSource) return;
		try { musicSource.stop(); } catch (_) {}
		musicSource.disconnect();
		musicSource = null;
	}

	function playSfx(name, pitch = 1, volumeDb = 0) {
		if (!webContext || muted) return;
		const frequencies = { peck: 720, shoot: 390, swap: 540, cluck: 260, impact: 180, pop: 660,
			cascade: 820, match: 760, collapse: 130, reverse: 310, boss_warn: 150, boss_intro: 110,
			boss_hit: 190, boss_defeat: 95, ability: 480, achievement: 880, danger: 170, win: 920,
			happy_cluck: 440, lose: 120, sigh: 210, near_miss: 600 };
		const duration = ["win", "achievement", "boss_defeat"].includes(name) ? 0.42 : 0.12;
		const oscillator = webContext.createOscillator();
		const envelope = webContext.createGain();
		const now = webContext.currentTime;
		oscillator.type = ["impact", "collapse", "boss_hit", "lose"].includes(name) ? "sawtooth" : "sine";
		oscillator.frequency.setValueAtTime((frequencies[name] || 420) * Number(pitch || 1), now);
		oscillator.frequency.exponentialRampToValueAtTime(Math.max(70, oscillator.frequency.value * 0.72), now + duration);
		const amplitude = Math.min(0.32, 0.2 * Math.pow(10, Number(volumeDb || 0) / 20));
		envelope.gain.setValueAtTime(amplitude, now);
		envelope.gain.exponentialRampToValueAtTime(0.0001, now + duration);
		oscillator.connect(envelope);
		envelope.connect(sfxGain);
		oscillator.start(now);
		oscillator.stop(now + duration);
	}

	for (const eventName of ["pointerdown", "touchend", "keydown"]) {
		window.addEventListener(eventName, unlock, { capture: true, passive: true });
	}
	soundUnlockButton.addEventListener("click", unlock);

	return {
		unlock,
		playMusic,
		stopMusic,
		playSfx,
		setMix(master, sfx, music, isMuted) {
			masterLevel = Math.max(0, Math.min(1, Number(master)));
			sfxLevel = Math.max(0, Math.min(1, Number(sfx)));
			musicLevel = Math.max(0, Math.min(1, Number(music)));
			muted = Boolean(isMuted);
			updateMix();
		},
		onUnlock(fn) { if (unlocked) fn(); else callbacks.push(fn); },
		markEngineReady() {
			engineReady = true;
			if (contexts.size && !notifyIfRunning()) soundUnlockButton.hidden = false;
		},
		status() { return { unlocked, contexts: [...contexts].map((context) => context.state), webMusic: Boolean(musicSource) }; },
	};
})();
const engine = new Engine(GODOT_CONFIG);

/** Bridge used by Godot (VatarBridge.gd) and the Lagos Life / Vatar SDK. */
const fullscreenButton = document.getElementById("fullscreen");
fullscreenButton.hidden = true;
fullscreenButton.addEventListener("click", async () => {
	try {
		if (document.fullscreenElement) await document.exitFullscreen();
		else await document.documentElement.requestFullscreen();
	} catch (_) { fullscreenButton.hidden = true; }
});
document.addEventListener("fullscreenchange", () => {
	const label = document.fullscreenElement ? "Exit fullscreen" : "Fullscreen";
	fullscreenButton.textContent = label;
	fullscreenButton.setAttribute("aria-label", label);
	document.getElementById("canvas").focus();
});
window.CluckVatar = {
	ready: false,
	player: null,
	mode: null,
	_pauseCbs: [],
	_browserPauseCbs: [],
	_audioUnlockCbs: [],
	onBrowserPause(fn) { this._browserPauseCbs.push(fn); },
	onAudioUnlock(fn) {
		this._audioUnlockCbs.push(fn);
		window.CluckAudio.onUnlock(() => { try { fn(); } catch (_) {} });
	},
	_resumeCbs: [],
	_purchaseCbs: [],
	onPause(fn) { this._pauseCbs.push(fn); },
	onResume(fn) { this._resumeCbs.push(fn); },
	onPurchase(fn) { this._purchaseCbs.push(fn); },
	async init() {
		if (typeof Vatar === "undefined") {
			return { ok: false, reason: "no_sdk" };
		}
		try {
			const result = await Vatar.init();
			this.ready = true;
			this.player = result.player || null;
			this.mode = result.mode || null;
			const banner = document.getElementById("vatar-banner");
			if (banner && this.player && this.player.name) {
				banner.style.display = "block";
				banner.textContent = "Hi " + this.player.name + " · Lagos Life";
				setTimeout(() => { banner.style.display = "none"; }, 3200);
			}
			Vatar.onPause(() => this._pauseCbs.forEach((fn) => { try { fn(); } catch (e) {} }));
			Vatar.onResume(() => this._resumeCbs.forEach((fn) => { try { fn(); } catch (e) {} }));
			Vatar.onPurchase((p) => this._purchaseCbs.forEach((fn) => { try { fn(p); } catch (e) {} }));
			// Deliver anything paid while we were away / reloading.
			try {
				const pending = await Vatar.purchases();
				(pending || []).forEach((p) => this._purchaseCbs.forEach((fn) => { try { fn(p); } catch (e) {} }));
			} catch (e) {}
			return { ok: true, player: this.player, mode: this.mode };
		} catch (err) {
			return { ok: false, reason: (err && err.code) || "init_failed", message: String(err && err.message || err) };
		}
	},
	async submitScore(n) {
		if (!this.ready || typeof Vatar === "undefined") return null;
		try { return await Vatar.submitScore(Number(n) | 0); }
		catch (e) { return null; }
	},
	async purchase(productId) {
		if (!this.ready || typeof Vatar === "undefined") throw new Error("not_ready");
		return await Vatar.purchase(String(productId));
	},
	async session() {
		if (!this.ready || typeof Vatar === "undefined") throw new Error("not_ready");
		return await Vatar.session();
	},
	async claim(purchaseId) {
		const { session } = await this.session();
		const r = await fetch("/claim", {
			method: "POST",
			headers: { "Content-Type": "application/json" },
			body: JSON.stringify({ session, purchaseId }),
		});
		if (!r.ok) throw new Error("claim_failed_" + r.status);
		return await r.json().catch(() => ({ ok: true }));
	},
	async leaderboard() {
		if (!this.ready || typeof Vatar === "undefined") return null;
		try { return await Vatar.leaderboard(); }
		catch (e) { return null; }
	},
};

function pauseForBrowserChange() {
	window.CluckVatar._browserPauseCbs.forEach(fn => { try { fn(); } catch (_) {} });
}
document.addEventListener("visibilitychange", () => { if (document.hidden) pauseForBrowserChange(); });
if (screen.orientation) screen.orientation.addEventListener("change", pauseForBrowserChange);

(function () {
	const statusOverlay = document.getElementById("status");
	const statusProgress = document.getElementById("status-progress");
	const statusNotice = document.getElementById("status-notice");
	const statusHint = document.getElementById("status-hint");
	const statusRetry = document.getElementById("status-retry");
	let initializing = true;
	let statusMode = "";
	let compileTimer = 0;
	statusRetry.addEventListener("click", () => location.reload());

	function setHint(text) {
		if (!statusHint) return;
		statusHint.textContent = text;
		statusHint.style.display = text ? "block" : "none";
	}

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) return;
		if (mode === "hidden") {
			clearTimeout(compileTimer);
			statusOverlay.remove();
			initializing = false;
			fullscreenButton.hidden = !document.fullscreenEnabled;
			return;
		}
		statusOverlay.style.visibility = "visible";
		statusProgress.style.display = mode === "progress" ? "block" : "none";
		statusNotice.style.display = mode === "notice" ? "block" : "none";
		if (statusHint) statusHint.style.display = mode === "progress" ? "block" : "none";
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) statusNotice.removeChild(statusNotice.lastChild);
		String(text).split("\n").forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement("br"));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		setStatusNotice(err instanceof Error ? err.message : String(err || "An unknown error occurred."));
		setStatusMode("notice");
		initializing = false;
	}

	// Emscripten's default-framebuffer blit queries SCISSOR_TEST each frame.
	// On some ANGLE drivers that query synchronously drains the GPU queue.
	// Mirror only this boolean, on our canvas only. Other GL queries pass through.
	// ?native_gl_queries=1 keeps an unmodified context for A/B profiling.
	if (!new URLSearchParams(location.search).has("native_gl_queries")) {
		const canvas = document.getElementById("canvas");
		const getContext = canvas.getContext.bind(canvas);
		const wrapped = new WeakSet();
		canvas.getContext = function (type, attributes) {
			const gl = getContext(type, attributes);
			if (!gl || type !== "webgl2" || wrapped.has(gl)) return gl;
			wrapped.add(gl);
			const getParameter = gl.getParameter.bind(gl);
			const enable = gl.enable.bind(gl);
			const disable = gl.disable.bind(gl);
			let scissor;
			gl.enable = function (capability) {
				enable(capability);
				if (capability === gl.SCISSOR_TEST) scissor = true;
			};
			gl.disable = function (capability) {
				disable(capability);
				if (capability === gl.SCISSOR_TEST) scissor = false;
			};
			gl.getParameter = function (parameter) {
				if (parameter !== gl.SCISSOR_TEST) return getParameter(parameter);
				if (scissor === undefined) scissor = getParameter(parameter);
				return scissor;
			};
			// Restored contexts reset their state; never reuse the previous value.
			canvas.addEventListener("webglcontextlost", () => { scissor = undefined; });
			canvas.addEventListener("webglcontextrestored", () => { scissor = undefined; });
			return gl;
		};
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		displayFailureNotice("Error\nMissing browser features:\n" + missing.join("\n"));
		return;
	}

	setStatusMode("progress");
	setHint("Downloading… first load can take a minute on mobile.");
	engine.startGame({
		onProgress(current, total) {
			if (current > 0 && total > 0) {
				const percent = Math.min(100, Math.floor((current / total) * 100));
				statusProgress.style.setProperty("--load-progress", percent + "%");
				statusProgress.setAttribute("aria-valuenow", String(percent));
				if (current >= total) {
					statusProgress.classList.add("compiling");
					statusProgress.removeAttribute("aria-valuenow");
					statusProgress.setAttribute("aria-valuetext", "Starting game");
					setHint("Starting the game…");
					if (!compileTimer) compileTimer = setTimeout(() => {
						if (!initializing) return;
						setHint("Startup is taking longer than expected.");
						statusRetry.classList.add("visible");
					}, 30000);
				} else {
					statusProgress.classList.remove("compiling");
					setHint("Downloading… " + percent + "%");
				}
			} else {
				statusProgress.classList.add("compiling");
				statusProgress.removeAttribute("aria-valuenow");
				setHint("Preparing…");
			}
		},
	}).then(() => {
		setStatusMode("hidden");
		window.CluckAudio.markEngineReady();
	}, displayFailureNotice);
}());
	</script>
</body>
</html>
