name = "withered-bird-1943"
main = "cloudflare/worker.js"
compatibility_date = "2024-11-01"

# After deploy:
#   npx wrangler secret put VATAR_SECRET          # vtr_test_… from Lagos Life
#   npx wrangler secret put VATAR_WEBHOOK_SECRET  # vtr_whsec_test_… (optional webhook)
# Webhook URL in dashboard: https://cluck.vidcipe.online/vatar-webhook

[assets]
directory = "./builds/web-cf"
binding = "ASSETS"
# Required so the Worker can attach Content-Encoding: br on index.wasm.
run_worker_first = true
html_handling = "none"
not_found_handling = "none"
